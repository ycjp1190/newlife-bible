# 검사와 자동 배포
# - 변경 제안(PR): 자동 검사만 실행
# - main 에 반영(merge/push): 검사 통과 시 Cloudflare 에 자동 배포
name: 검사와 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 자동 검사
        run: node --test tests/*.test.mjs
      - name: 기본 읽기표가 코드와 일치하는지 확인
        run: node scripts/build-plan.mjs && git diff --exit-code data/

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 모임용 DB 표 구조 변경 적용 (migrations-group/)
        run: npx wrangler d1 migrations apply malsseum --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Cloudflare 배포 (모임용)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: 개인용 DB 표 구조 변경 적용 (migrations-personal/)
        run: npx wrangler d1 migrations apply malsseum-personal --env personal --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: 개인용 관리자 코드 설정 (GitHub 비밀값 ADMIN_CODE → Cloudflare 비밀값)
        run: |
          if [ -n "$ADMIN_CODE" ]; then printf '%s' "$ADMIN_CODE" | npx wrangler secret put ADMIN_CODE --env personal; else echo "ADMIN_CODE 없음 - 건너뜀"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
      - name: Cloudflare 배포 (개인용)
        run: npx wrangler deploy --env personal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Cloudflare 배포 (개인용 관리자 앱)
        run: |
          if [ -n "$ADMIN_CODE" ]; then printf '%s' "$ADMIN_CODE" | npx wrangler secret put ADMIN_CODE --env admin; fi
          npx wrangler deploy --env admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
