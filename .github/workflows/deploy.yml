# 검사와 자동 배포
# - 변경 제안(PR): 자동 검사만 실행
# - main 에 반영(merge/push): 검사 통과 시 Cloudflare 에 자동 배포
name: 검사와 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 자동 검사
        run: node --test tests/*.test.mjs
      - name: 기본 읽기표가 코드와 일치하는지 확인
        run: node scripts/build-plan.mjs && git diff --exit-code data/

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cloudflare 배포
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
