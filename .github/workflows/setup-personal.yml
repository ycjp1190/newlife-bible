# 개인용 앱 최초 준비 (한 번만 실행 후 이 파일은 지운다)
# 개인용 알림 키 만들기: 비밀키는 화면에 찍지 않고 바로 Cloudflare 비밀값으로 저장, 공개키만 기록에 남김
# (데이터베이스는 이전 실행에서 이미 만들었다)
name: 개인용 앱 최초 준비

on:
  push:
    branches: [personal-mode]
    paths: [".github/workflows/setup-personal.yml"]

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 개인용 알림 키 만들기
        run: |
          sed -i "s/PERSONAL_DB_ID/7fe7c2d9-2cee-4944-b236-51c74dfc9507/" wrangler.toml
          node scripts/gen-vapid.mjs > keys.txt
          sed -n 's/^VAPID_PRIVATE_KEY = //p' keys.txt | tr -d '\n' | npx wrangler secret put VAPID_PRIVATE_KEY --env personal
          echo "PUBLIC_KEY_FOR_TOML: $(sed -n 's/^VAPID_PUBLIC_KEY = //p' keys.txt)"
          rm keys.txt
