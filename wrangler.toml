# Cloudflare 배포 설정 — "말씀 읽고 새 인생"
# 같은 코드를 두 앱으로 배포한다.
#   - 모임용(기본):        npx wrangler deploy                 → malsseum-new-life
#   - 개인용(env.personal): npx wrangler deploy --env personal  → malsseum-personal
# 두 앱은 주소·데이터베이스·알림 키가 모두 따로다.
name = "malsseum-new-life"
main = "worker/index.js"
compatibility_date = "2025-09-01"
account_id = "6678aa6683d9c644c2db3b66c13ffcb3"

# 앱 화면 파일 (public/). /api/* 와 /personal/* 요청은 Worker 코드가 먼저 처리한다.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/personal/*"]

# 데이터베이스 (schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "malsseum"
database_id = "6d176e67-8acb-4e13-ac28-009f9a535e8d"
# 표 구조 변경 파일. 배포 때 GitHub Actions 가 `wrangler d1 migrations apply` 로 차례로 적용한다.
migrations_dir = "migrations-group"

# 5분마다 알림 대상 확인
[triggers]
crons = ["*/5 * * * *"]

# 대화 실시간 연결용 대화방 (모임용만 사용. Durable Object, 무료 플랜 SQLite 방식)
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1-chat-room"
new_sqlite_classes = ["ChatRoom"]

# 공개해도 되는 값. 비밀값(VAPID_PRIVATE_KEY, INVITE_CODE)은 `wrangler secret put` 으로 넣는다.
[vars]
VAPID_PUBLIC_KEY = "BO_3V5cXzqCybefQIvBY2rN84ujPuZ1K5GXG4OKOJ1zpCuB0DfD7u7eX4CJmxBw8H-RM1xjsMggSK3o3PqoV1tQ"
VAPID_SUBJECT = "https://malsseum-new-life.newlife-bible.workers.dev"

# ── 개인용 앱 ─────────────────────────────────────────
[env.personal]
name = "malsseum-personal"

[env.personal.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 개인용은 아이콘·manifest 도 Worker 가 public/personal/ 의 것으로 바꿔 보여 준다
run_worker_first = ["/", "/index.html", "/api/*", "/personal/*", "/icons/*", "/manifest.webmanifest", "/admin.webmanifest"]

# 데이터베이스 (schema-personal.sql)
[[env.personal.d1_databases]]
binding = "DB"
database_name = "malsseum-personal"
database_id = "7fe7c2d9-2cee-4944-b236-51c74dfc9507"
# 표 구조 변경 파일. 배포 때 GitHub Actions 가 `wrangler d1 migrations apply` 로 차례로 적용한다.
migrations_dir = "migrations-personal"

[env.personal.triggers]
crons = ["*/5 * * * *"]

# 비밀값 VAPID_PRIVATE_KEY 는 `wrangler secret put VAPID_PRIVATE_KEY --env personal` 로 넣는다. (초대 코드 없음)
[env.personal.vars]
MODE = "personal"
# 운영자 확인용 이름 — 관리자 통계·인원수에서 뺀다 (쉼표로 여러 개)
TEST_NAMES = "Admin"
VAPID_PUBLIC_KEY = "BNudWbT87Efvz4qX2Ddae6DKyTC-bgJr3mvBdZmCxz8026QTlYCDRcGBpeU5t403fWWQdnpcdVN8B6T0kGxtdR0"
VAPID_SUBJECT = "https://malsseum-personal.newlife-bible.workers.dev"

# ── 개인용 관리자 앱 (별도 주소라 갤럭시에서도 따로 설치됨) ─────────
# 개인용과 같은 데이터베이스를 보지만 관리자 화면·관리자 API 만 연다. 알림 예약 실행 없음.
[env.admin]
name = "malsseum-admin"

[env.admin.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/index.html", "/api/*", "/personal/*", "/icons/*", "/manifest.webmanifest", "/admin.webmanifest"]

[[env.admin.d1_databases]]
binding = "DB"
database_name = "malsseum-personal"
database_id = "7fe7c2d9-2cee-4944-b236-51c74dfc9507"

[env.admin.triggers]
crons = []

# 비밀값 ADMIN_CODE 는 배포 때 GitHub 비밀값에서 넣는다.
[env.admin.vars]
MODE = "personal"
ADMIN_APP = "1"
TEST_NAMES = "Admin"
